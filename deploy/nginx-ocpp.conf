# Public entry point for chargers ONLY.  Install as /etc/nginx/conf.d/efalcon-ocpp.conf
# Listens on plain ws:// port 9988 (what the charger's OCPP screen is set up for) and forwards
# nothing but /ocpp/ to the E-Falcon server on 127.0.0.1:4000. The admin API and dashboard
# socket are not reachable through this port.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 9988;
    server_name _;

    # Shows exactly what each charger asked for, including refused attempts.
    access_log /var/log/nginx/efalcon-ocpp.log;

    location /ocpp/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        return 404;
    }
}
